<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #ffffff;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            border: 1px solid #ddd;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px #eee;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .actions {
            margin-top: 30px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background-color: #13400d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        a {
            padding: 10px 20px;
            background-color: #0f2f0a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;

        }

        a:hover{
            background-color: #13400d;
        }

        button:hover {
            background-color: #0f2f0a;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-row label {
            text-align: left;
        }

        .form-row input {
            margin-left: auto;
            margin-right: 0;
            width: 250px;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .validation-container {
            text-align: right;
            margin-bottom: 15px;
        }

        .validation-container p
        {
            color: #ff0000;
            font-size: 10px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            animation: scaleIn 0.25s ease-out;
        }

        .modal-box h2 {
            margin-top: 0;
            color: #c0392b;
        }

        .modal-box button {
            margin-top: 20px;
            padding: 8px 20px;
            background-color: #13400d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal-box button:hover {
            background-color: #0f2f0a;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

    </style>
    <script>
        function closeModal() {
            document.querySelector('.modal-overlay').style.display = 'none';
        }
    </script>
</head>
<body>

<div class="container">
    <h1>Autentificati-va</h1>

    <form th:action="@{/session}" method="get">
        <div class="form-row">
            <label>Username:</label>
            <input type="text" name="username" th:value="${username}"/>
        </div>
        <div class="validation-container">
            <div th:if="${valid10 == false}">
                <p>Acest camp este obligatoriu</p>
            </div>
        </div>

        <div class="form-row">
            <label>Password:</label>
            <input type="password" name="password" />
        </div>
        <div class="validation-container">
            <div th:if="${valid20 == false}">
                <p>Acest camp este obligatoriu</p>
            </div>
        </div>
        <div class="actions">
            <button type="submit">Login</button>
            <a href="/">Inapoi la pagina principala</a>
        </div>
    </form>
</div>

<div th:if="${valid11 == false || valid21 == false}" class="modal-overlay">
    <div class="modal-box">
        <p th:text="${message}"></p>
        <button onclick="closeModal()">OK</button>
    </div>
</div>

</body>
</html>
