<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<style>
    body
    {
        font-family: 'Segoe UI', sans-serif;
        background-color: white;
        color: #333;
        margin: 0;
        padding: 20px;
    }
    .container
    {
        max-width: 1000px;
        margin: auto;
    }
    .header
    {
        border-bottom: 2px solid #0056b3;
        padding-bottom: 10px;
        margin-bottom: 30px;
    }
    .stats-grid
    {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 40px;
        text-align: center;
    }
    .stat-card
    {
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        text-align: center;
        box-shadow: 2px 2px 5px #eee;
    }
    .stat-card h3
    {
        margin: 0;
        color: #0056b3;
        font-size: 1.2em;
    }
    .stat-card p
    {
        font-size: 1.5em;
        font-weight: bold;
        margin: 10px 0 0;
    }
    .menu-grid
    {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        text-align: center;
    }
    .menu-item
    {
        display: block;
        padding: 25px;
        background-color: #f8f9fa;
        border: 1px solid #0056b3;
        color: #0056b3;
        text-decoration: none;
        border-radius: 5px;
        text-align: center;
        font-weight: bold;
    }
    .menu-item:hover
    {
        background-color: #0056b3;
        color: white;
        transition: 0.3s;
    }
</style>
<head>
    <meta charset="UTF-8">
    <title>Sistem Management Scolar</title>
</head>
<header>
    <div th:if="${session.username == null}"
         style="text-align:right; margin-top:10px;">
        <form th:action="@{/login}" method="get" style="display:inline;">
            <button type="submit" style="margin-left:15px; padding:6px 12px;">Login</button>
        </form>
    </div>

    <div th:if="${session.username != null}"
         style="text-align:right; margin-top:10px;">
        <span>
            Autentificat ca:
            <strong th:text="${session.username}"></strong>
        </span>

        <form th:action="@{/endSession}" method="post" style="display:inline;">
            <button type="submit"
                    style="margin-left:15px; padding:6px 12px;">
                Logout
            </button>
        </form>
    </div>
</header>

<body>
<div class="container">
    <div class="header">
        <h1>Gestionarea claselor de elevi de la liceu</h1>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Elevi</h3>
            <p th:text="${totalElevi}"></p>
        </div>
        <div class="stat-card">
            <h3>Nr. de clase</h3>
            <p th:text="${totalClase}"></p>
        </div>
    </div>

    <div class="menu-grid">
        <a th:href="@{/claseIndex}" class="menu-item">Gestionare Clase & Profiluri</a>
    </div>
</div>
</body>
</html>
